<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microprocessor and Microcontroller - PYQs</title>
    <style>
      :root {
        --page-bg: #d9d9d9;
        --panel: #f5f3f2;
        --ink: #101010;
        --line: #1c1c1c;
        --yellow: #f4d400;
        --blue-soft: #dfeaf6;
        --green-soft: #d9f2d9;
        --pink-soft: #f4dfe7;
        --orange-soft: #f6e2d7;
        --white: #ffffff;
        --gray: #e7e7e7;
        --green: #1f9d5a;
        --red: #ef3b3b;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--page-bg);
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--ink);
      }

      body {
        padding: 22px;
      }

      #questionsContainer {
        display: flex;
        flex-direction: column;
        gap: 26px;
      }

      .page {
        width: min(100%, 1280px);
        min-height: 720px;
        aspect-ratio: 16 / 9;
        margin: 0 auto;
        background: var(--panel);
        border: 4px solid var(--line);
        overflow: hidden;
        position: relative;
      }

      .header {
        background: var(--yellow);
        border-bottom: 4px solid var(--line);
        height: 92px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(28px, 2.5vw, 58px);
        font-weight: 900;
        letter-spacing: 0.2px;
      }

      .meta {
        display: grid;
        grid-template-columns: 1.25fr 1.2fr 0.9fr;
        border-bottom: 4px solid var(--line);
        background: #eeeeee;
      }

      .meta-box {
        min-height: 64px;
        border-right: 3px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 900;
        font-size: clamp(18px, 1.6vw, 30px);
        padding: 8px 12px;
      }

      .meta-box:last-child { border-right: none; }
      .meta-label { font-weight: 900; }
      .meta-value.exam { color: #1b2aa1; }
      .meta-value.date { color: #1b5e1b; }
      .meta-value.shift { color: #0d5f2c; }

      .content {
        display: grid;
        grid-template-columns: 1.12fr 0.88fr;
        height: calc(100% - 168px);
      }

      .left-panel {
        padding: 16px 18px 10px 18px;
        border-right: 4px solid var(--line);
        background: var(--panel);
      }

      .question-box {
        font-size: clamp(18px, 2vw, 36px);
        line-height: 1.3;
        font-weight: 900;
        margin-top: 8px;
        margin-bottom: 16px;
      }

      .q-mark {
        font-weight: 900;
      }

      .answers {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .option {
        display: grid;
        grid-template-columns: 52px 1fr;
        align-items: center;
        min-height: 60px;
        border: 2px solid rgba(0,0,0,0.2);
        background: var(--blue-soft);
        padding: 6px 10px 6px 6px;
        font-size: clamp(16px, 1.4vw, 28px);
        font-weight: 800;
      }

      .option-letter {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--yellow);
        border: 3px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 0.9em;
        margin-left: 6px;
      }

      .option-text {
        padding-left: 10px;
      }

      .right-panel {
        background: #f7f7f7;
        padding: 16px 18px 10px 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .diagram {
        position: relative;
        flex: 1;
        min-height: 220px;
        background: linear-gradient(180deg, #f1f1f1, #efefef);
        border: 3px solid rgba(0,0,0,0.2);
        overflow: hidden;
      }

      .diagram-grid {
        position: absolute;
        inset: 18px 18px 18px 18px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .diagram-col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .diag-item {
        flex: 1;
        min-height: 44px;
        border: 2px solid rgba(0,0,0,0.35);
        background: #e2f0f9;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-weight: 800;
        font-size: 13px;
        padding: 8px 6px;
      }

      .diag-item:nth-child(2n) { background: #dfeaf6; }
      .diag-item.alt { background: #dcefe3; }

      .diagram-title {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--yellow);
        border: 3px solid var(--line);
        font-weight: 900;
        font-size: clamp(20px, 1.7vw, 32px);
        padding: 8px 18px;
      }

      .answer-tag {
        align-self: flex-end;
        margin-top: 12px;
        background: #ebf9ee;
        color: #115a31;
        border: 3px solid #1c8f5a;
        border-radius: 10px;
        padding: 8px 14px;
        font-weight: 900;
        font-size: 17px;
      }

      .footer-label {
        display: flex;
        justify-content: center;
        margin-top: 10px;
      }

      .stamp {
        background: #ff3a3a;
        color: #fff;
        border: 4px solid var(--line);
        border-radius: 10px;
        padding: 8px 22px;
        font-size: clamp(22px, 2vw, 40px);
        font-weight: 900;
      }

      @page {
        size: landscape;
        margin: 0;
      }

      @media print {
        html, body {
          background: white;
          margin: 0;
          padding: 0;
        }

        body {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }

        .page {
          page-break-after: always;
          page-break-inside: avoid;
          break-after: page;
          box-shadow: none;
          border-width: 3px;
        }

        #questionsContainer {
          gap: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="questionsContainer"></div>

    <script>
      const questions = [
        { q: 'Intel 8051 microcontroller किस प्रकार का microcontroller है?', options: ['64-bit microcontroller', '16-bit microcontroller', '24-bit microcontroller', '8-bit microcontroller'], answer: 'D', exam: 'RRB Technician Grade-I', date: '19 December 2024', shift: 'Shift 2' },
        { q: 'Intel 8051 microcontroller में कितनी internal RAM होती है?', options: ['64-byte', '128-byte', '32-byte', '16-byte'], answer: 'B', exam: 'RRB Technician Grade-I', date: '19 December 2024', shift: 'Shift 2' },
        { q: 'Intel 8051 microcontroller में कितने 16-bit timer/counter registers होते हैं?', options: ['तीन', 'एक', 'दो', 'चार'], answer: 'C', exam: 'RRB Technician Grade-I', date: '19 December 2024', shift: 'Shift 1' },
        { q: 'Intel 8051 और Intel 8052 में क्रमशः कितनी interrupt structures होती हैं?', options: ['6 और 7', '4 और 5', '7 और 8', '5 और 6'], answer: 'D', exam: 'RRB Technician Grade-I', date: '19 December 2024', shift: 'Shift 3' },
        { q: 'Microprocessor 8085 में निम्नलिखित में से कौन-सा 16-bit register है?', options: ['Z register', 'W register', 'Flag register', 'Stack Pointer'], answer: 'D', exam: 'RRB Technician Grade-I', date: '19 December 2024', shift: 'Shift 1' },
        { q: '8085 microprocessor के संबंध में निम्नलिखित में से कौन-सा कथन सही नहीं है?', options: ['इसमें serial I/O control होता है, जिससे serial communication संभव होता है।', 'इसमें interrupt handling capacity बढ़ाने की व्यवस्था होती है।', 'IC 8155 और IC 8355 जैसे supporting I/O devices के साथ इसका उपयोग three-chip microcomputer बनाने में किया जा सकता है।', 'इसमें bus cycles को control करने के लिए IO/M, RD और WR जैसे control signals नहीं होते, इसलिए external bus controller आवश्यक होता है।'], answer: 'D', exam: 'RRB Technician Grade-I', date: '19 December 2024', shift: 'Shift 1' },
        { q: '8085 microprocessor में कितनी address lines होती हैं और इनके द्वारा अधिकतम कितनी memory access की जा सकती है?', options: ['16 lines; 32 KB', '8 lines; 32 KB', '8 lines; 64 KB', '16 lines; 64 KB'], answer: 'D', exam: 'RRB Technician Grade-I', date: '19 December 2024', shift: 'Shift 2' },
        { q: '8085 microprocessor का Address/Data buffer किस प्रकार का buffer है?', options: ['16-bit और unidirectional', '8-bit और bi-directional', '16-bit और bi-directional', '8-bit और unidirectional'], answer: 'B', exam: 'RRB Technician Grade-I', date: '20 December 2024', shift: 'Shift 1' },
        { q: '8085 microprocessor clock cycle किस duty cycle पर operate करता है?', options: ['25%', '50%', '10%', '75%'], answer: 'B', exam: 'RRB Technician Grade-I', date: '20 December 2024', shift: 'Shift 1' },
        { q: 'निम्नलिखित में से कौन-सा Intel 8051 series के microcontroller का member नहीं है?', options: ['80C31BH', '8044AH', '80C51BH', '87C51'], answer: 'B', exam: 'RRB Technician Grade-I', date: '20 December 2024', shift: 'Shift 1' },
        { q: '8051 microcontroller का Port 0 अन्य ports से architectural रूप से मुख्यतः किस कारण अलग है?', options: ['यह केवल memory expansion के लिए reserved है।', 'इसमें internal pull-up resistors नहीं होते।', 'यह output port के रूप में कार्य नहीं कर सकता।', 'यह bit-addressable नहीं है।'], answer: 'B', exam: 'RRB Technician Grade-I', date: '13 March 2026', shift: 'N/A' },
        { q: '8051 microcontroller में PSEN एक ______ output signal है, जिसका उपयोग ______ memory को access करने के लिए read strobe के रूप में किया जाता है।', options: ['Active high, internal RAM', 'Active low, external program', 'Active low, internal RAM', 'Active high, external program'], answer: 'B', exam: 'RRB Technician Grade-I', date: '13 March 2026', shift: 'N/A' },

        { q: '8051 microcontroller में कौन-सा port dual function नहीं रखता?', options: ['Port 1', 'Port 2', 'Port 3', 'Port 0'], answer: 'A', exam: 'RRB JE ECE', date: '22 April 2025', shift: 'Shift 2 CBT-2' },
        { q: '8051 microcontroller के XTAL1 और XTAL2 pins का मुख्य कार्य क्या है?', options: ['External interrupt control', 'Oscillator connection for clock generation', 'Address/data bus decoding', 'Serial data transmission'], answer: 'B', exam: 'RRB JE ECE', date: '22 April 2025', shift: 'Shift 1 CBT-2' },

        { q: '8051 microcontroller external memory को मुख्य रूप से किस माध्यम से access करता है?', options: ['Direct addressing', 'Immediate addressing', 'Register addressing', 'DPTR के माध्यम से indirect addressing'], answer: 'D', exam: 'RRB JE CBT-2 Electronics Re-Exam', date: '4 June 2025', shift: 'N/A' },

        { q: '8051 microcontroller में unconditional jump के लिए कौन-सा instruction प्रयोग होता है?', options: ['CJNE', 'SJMP', 'JZ', 'JNZ'], answer: 'B', exam: 'UPPCL JE Electrical', date: '8 September 2021', shift: 'Shift 2' },

        { q: '8051 microcontroller में कुल कितने 8-bit ports उपलब्ध होते हैं?', options: ['8', '6', '2', '4'], answer: 'D', exam: 'UPPCL JE Electrical', date: '8 September 2021', shift: 'Shift 2' },
        { q: '8051 microcontroller में कितने Special Function Registers (SFRs) होते हैं?', options: ['21', '8', '16', '11'], answer: 'A', exam: 'UPPCL JE EC', date: '25 March 2021', shift: 'Shift 1' },
        { q: '8051 microcontroller में दो 16-bit SFRs कौन-से हैं?', options: ['PC और DPTR', 'SP और PSW', 'SP और DPTR', 'PC और SP'], answer: 'A', exam: 'UPPCL JE Previous Paper', date: '27 November 2019', shift: 'N/A' },
        { q: '8051 microcontroller maximum कितनी program memory और external data memory access कर सकता है?', options: ['64 KB, 32 KB', '32 KB, 64 KB', '64 KB, 64 KB', '16 KB, 64 KB'], answer: 'C', exam: 'UPPCL JE EC', date: '25 March 2021', shift: 'Shift 1' },
